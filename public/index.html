<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A live leaderboard of Grace's people. Grace may add, remove or move anyone, for any reason.">
  <meta name="theme-color" content="#f5f7fc">
  <link rel="canonical" href="https://grace.harrys.monster/">
  <title>Grace's people</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 18'><path fill='%233b5bdb' d='M12 11.19c5.65 0 8.61-6.28 5.98-10.64-.17-.29.15-.69.43-.51C21.77 2.19 24 5.99 24 10.26c0 2.91-1 5.5-2.76 7.58l-3.11-1.07c.6-.56 1.12-1.2 1.55-1.9.98-1.6-1.22-2.59-2.92-1.78-1.44.69-3.05 1.08-4.75 1.08s-3.31-.39-4.75-1.08c-1.69-.81-3.89.17-2.92 1.78.42.69.94 1.33 1.55 1.9l-3.13 1.08C1 15.76 0 13.18 0 10.26 0 5.99 2.23 2.19 5.59.04c.28-.18.6.22.43.51C3.39 4.9 6.35 11.19 12 11.19z'/></svg>">

  <!-- Styles -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">

  <!-- Captures Grace's key from the fragment and strips it from the URL. Must stay
       ahead of the analytics snippet below, whose pageview beacon sends the path
       and fragment. -->
  <script src="js/key.js"></script>
<script>
(function(){var A='https://analytics.harrys.monster/e',v;
try{v=localStorage.getItem('_aid')||crypto.randomUUID();localStorage.setItem('_aid',v)}catch(e){v='anon'}
var t0=Date.now(),ms=0,lcp=0,cls=0,de=document.documentElement;
function send(o){o.vid=v;o.site=location.host;o.path=location.pathname+location.hash;
try{navigator.sendBeacon(A,JSON.stringify(o))}catch(e){}}
function pv(){send({t:'pv',ref:document.referrer,q:location.search,ti:document.title,
lang:navigator.language,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,
sw:screen.width,sh:screen.height,w:innerWidth,h:innerHeight,dw:de.scrollWidth,dh:de.scrollHeight})}
pv();addEventListener('hashchange',pv);
try{new PerformanceObserver(function(l){var e=l.getEntries();lcp=Math.round(e[e.length-1].startTime)}).observe({type:'largest-contentful-paint',buffered:true});
new PerformanceObserver(function(l){l.getEntries().forEach(function(e){if(!e.hadRecentInput)cls+=e.value})}).observe({type:'layout-shift',buffered:true})}catch(e){}
addEventListener('scroll',function(){var s=(scrollY+innerHeight)/de.scrollHeight*100;if(s>ms)ms=s},{passive:true});
addEventListener('click',function(e){var el=e.target.closest?e.target.closest('a,button,[data-track]')||e.target:e.target;
var cn=typeof el.className=='string'&&el.className.trim()?'.'+el.className.trim().split(/\s+/).slice(0,2).join('.'):'';
var o={t:'click',x:e.pageX,y:e.pageY,w:innerWidth,dw:de.scrollWidth,dh:de.scrollHeight,
sel:(el.tagName.toLowerCase()+(el.id?'#'+el.id:cn)).slice(0,140)};
var a=e.target.closest&&e.target.closest('a');if(a&&a.host&&a.host!=location.host)o.out=a.href;
send(o)},true);
addEventListener('error',function(e){send({t:'error',name:String(e.message||'error').slice(0,200),
props:{src:String(e.filename||'').slice(0,200),line:e.lineno,col:e.colno}})});
addEventListener('visibilitychange',function(){if(document.visibilityState=='hidden'){var n=performance.getEntriesByType('navigation')[0];
send({t:'leave',dur:Math.round((Date.now()-t0)/1e3),scroll:Math.round(Math.min(ms,100)),
lcp:lcp,cls:Math.round(cls*1000),load:n&&n.loadEventEnd?Math.round(n.loadEventEnd):0})}});
window.track=function(n,p){send({t:'custom',name:n,props:p})};
})();
</script></head>
<body>

  <header class="header">
    <nav class="nav" aria-label="Primary">
      <a href="https://harrys.monster" class="nav-logo" aria-label="Harry Cassidy, home"><svg class="nav-mark" viewBox="0 0 24 18" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 11.19c5.65 0 8.61-6.28 5.98-10.64-.17-.29.15-.69.43-.51C21.77 2.19 24 5.99 24 10.26c0 2.91-1 5.5-2.76 7.58l-3.11-1.07c.6-.56 1.12-1.2 1.55-1.9.98-1.6-1.22-2.59-2.92-1.78-1.44.69-3.05 1.08-4.75 1.08s-3.31-.39-4.75-1.08c-1.69-.81-3.89.17-2.92 1.78.42.69.94 1.33 1.55 1.9l-3.13 1.08C1 15.76 0 13.18 0 10.26 0 5.99 2.23 2.19 5.59.04c.28-.18.6.22.43.51C3.39 4.9 6.35 11.19 12 11.19z"/></svg></a>
      <span class="nav-title">Grace's people</span>
    </nav>
  </header>

  <main class="app container">
    <div class="intro">
      <h1>Grace's people</h1>
      <p class="rule">Grace may add, remove or move anyone, for any reason.</p>
    </div>

    <form class="add glass" id="add-form" hidden>
      <input id="add-name" name="name" aria-label="Name" placeholder="Name" maxlength="40" required autocomplete="off">
      <input id="add-rank" name="to" type="number" aria-label="Rank" placeholder="Rank" min="1" step="1" autocomplete="off">
      <input id="add-note" name="note" aria-label="Reason" placeholder="Reason (optional)" maxlength="200" autocomplete="off">
      <button type="submit" class="btn btn-primary">Add</button>
    </form>

    <form class="add glass" id="say-form" hidden>
      <input id="say-note" name="note" aria-label="Announcement" placeholder="Announcement" maxlength="200" required autocomplete="off">
      <button type="submit" class="btn btn-primary">Post</button>
    </form>

    <ol class="board glass" id="board"></ol>
    <p class="empty" id="empty" hidden>Nobody yet.</p>
    <p class="cloud" id="cloud" aria-label="Also on the board" hidden></p>

    <section class="changes">
      <h2>Recent changes</h2>
      <ul id="log" aria-live="polite"></ul>
    </section>
  </main>

  <template id="row-tpl">
    <li class="row">
      <span class="rank"></span>
      <span class="name"></span>
      <span class="since"></span>
      <span class="controls">
        <button type="button" class="btn btn-ghost up" aria-label="Move up">↑</button>
        <button type="button" class="btn btn-ghost down" aria-label="Move down">↓</button>
        <button type="button" class="btn btn-ghost to" aria-label="Move to rank">#</button>
        <button type="button" class="btn btn-ghost remove" aria-label="Remove">✕</button>
      </span>
    </li>
  </template>

  <dialog id="why" class="glass" aria-labelledby="why-title">
    <form method="dialog" id="why-form">
      <h2 id="why-title"></h2>
      <label class="why-rank" id="why-rank-wrap" hidden>New rank <input type="number" id="why-rank" min="1" step="1"></label>
      <textarea id="why-note" aria-label="Reason" maxlength="200" rows="3" placeholder="Reason (optional)"></textarea>
      <div class="why-actions">
        <button type="button" class="btn btn-ghost" id="why-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Do it</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <footer class="footer">
    <div class="container">
      <p>Updates live. Only Grace can change it.</p>
      <p>Harry Cassidy &copy; <span id="year">2026</span> ·
         <a href="https://harrys.monster">harrys.monster</a></p>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
